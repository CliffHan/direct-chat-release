# Site settings
title: direct-chat
description: 消息直接在两台设备之间传递，没有服务器、没有账号。
url: "https://direct-chat.clifftop.win"
# 自定义域名（见 CNAME 文件）绑定后站点位于根路径，baseurl 保持空字符串。
baseurl: ""

markdown: kramdown

# ── 发布信息 ────────────────────────────────────────────────────────────
# 两条发布线各自独立编号：原生版（Android）与原型版（仅 Windows x64）
native_version: "0.2.0"     # Android 原生版（当前主发布线）
proto_version: "0.1.2"      # 原型版（仅 Windows x64）

# 安装包一律托管在 GitHub Releases，不进仓库（0.2.0 的 universal APK 有 120 MiB，
# 超过 GitHub 单文件 100 MiB 上限）。升级版本时：先把新包传到 Releases，再改下面三项。
releases_url: "https://github.com/CliffHan/direct-chat-release/releases"
download_windows: "https://github.com/CliffHan/direct-chat-release/releases/download/proto-v0.1.2/isle_v0.1.2_efd980c_windows_x64.exe"
download_android: "https://github.com/CliffHan/direct-chat-release/releases/download/native-v0.2.0/isle_v0.2.0_038d898_android_universal_free.apk"

# 应用商店（已上架的写在这里，首页 Android 卡片会自动生成按钮；中英两版同步）
# 新增一家商店 = 往列表里加一条，正文不用改。note_* 可省略（省略则不显示小字）。
app_stores:
  - name: "APKPure"
    url: "https://apkpure.com/p/com.cliff.isle.free"
    note_zh: "第三方商店"
    note_en: "third-party store"

# 法律页面（/privacy/ 与 /terms/）共用的信息，改动只需在这里改一处
legal_effective_date: "2026-09-09"          # 生效日期（YYYY-MM-DD）
legal_last_updated: "2026-09-23"            # 最后更新日期（YYYY-MM-DD）
legal_developer: "Cliff Han"                # 开发者 / 法律责任主体名称（与各应用市场开发者账号保持一致）
legal_email: "cliff@clifftop.win"           # 隐私与条款联系邮箱
legal_address: "Available upon request"     # 邮寄地址（如需，改为真实地址）
legal_jurisdiction: "the laws of Singapore"                       # 管辖法律（中立选择，不在中国大陆上架）
legal_forum: "courts of Singapore"                                # 争议管辖法院（前面不要加 the）
legal_ads_platform: "Google AdMob"          # 当前使用的广告平台（更换平台时只改这里，两个法律页自动同步）
legal_ads_privacy_url: "https://policies.google.com/privacy"   # 上面平台的隐私政策链接（与上一行配套修改）
legal_project: "direct-chat"                # 项目总称
legal_app: "isle"                           # 当前已发布的应用名（后续新增应用在两个页面第 1 节补充即可）

# 不需要发布到站点的文件
exclude:
  - .workbuddy
  - draft.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
